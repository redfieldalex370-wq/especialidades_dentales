name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hostinger-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar aplicación
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Configurar llave SSH
        env:
          HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$HOSTINGER_SSH_PRIVATE_KEY" > "$HOME/.ssh/hostinger_deploy"
          chmod 600 "$HOME/.ssh/hostinger_deploy"
          ssh-keyscan -p 65002 -H 46.202.156.115 >> "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Verificar conexión con Hostinger
        run: |
          ssh \
            -i "$HOME/.ssh/hostinger_deploy" \
            -p 65002 \
            -o BatchMode=yes \
            u352513768@46.202.156.115 \
            "mkdir -p 'domains/lightgreen-reindeer-927529.hostingersite.com/public_html'"

      - name: Desplegar en Hostinger
        run: |
          rsync -az \
            -e "ssh -i $HOME/.ssh/hostinger_deploy -p 65002 -o BatchMode=yes" \
            dist/ \
            u352513768@46.202.156.115:domains/lightgreen-reindeer-927529.hostingersite.com/public_html/
